<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日付計算｜日数計算・〇日後・〇日前がすぐわかる | サクッと便利ツール</title>
<meta name="description" content="2つの日付の間の日数、〇日後・〇日前の日付と曜日を計算できる無料ツール。記念日、締め切り、契約期間の確認に。">
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<header><a class="logo" href="../../">🧰 サクッと便利ツール</a></header>
<main>
  <h1>日付計算（日数・〇日後・〇日前）</h1>
  <p class="lead">記念日、締め切り、契約期間の確認などに使えます。</p>

  <div class="card">
    <h2 style="margin-top:0">① 2つの日付の間の日数</h2>
    <label for="d1">開始日</label><input type="date" id="d1">
    <label for="d2">終了日</label><input type="date" id="d2">
    <label><input type="checkbox" id="incl" style="width:auto"> 開始日も1日目として数える</label>
    <div class="result">
      <div><span class="num" id="days">-</span><span class="lbl">日</span></div>
      <div><span class="num" id="weeks">-</span><span class="lbl">週と日</span></div>
      <div><span class="num" id="ymd">-</span><span class="lbl">年・か月・日</span></div>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">② 〇日後・〇日前の日付</h2>
    <label for="base">基準日</label><input type="date" id="base">
    <label for="n">日数（前の場合はマイナス。例：-30）</label><input type="number" id="n" value="100">
    <div class="result">
      <div><span class="num" id="after">-</span><span class="lbl">計算結果の日付</span></div>
    </div>
  </div>

  <div class="ad-slot"><!-- AD_SLOT --></div>
  <h2>よくある質問</h2>
  <p><strong>Q. 「開始日も数える」とは？</strong><br>例えば1月1日から1月3日までの場合、チェックなしなら2日、チェックありなら3日になります。宿泊日数などはチェックなし、イベントの開催日数などはチェックありが一般的です。</p>
  <p><strong>Q. うるう年は考慮されますか？</strong><br>はい、自動で考慮されます。</p>
</main>
<footer><a href="../../">ほかのツールを見る</a> · © サクッと便利ツール</footer>
<script>
const W = ['日','月','火','水','木','金','土'];
const $ = id => document.getElementById(id);
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = toISO(new Date());
$('d1').value = today; $('base').value = today;
function diff() {
  if (!$('d1').value || !$('d2').value) return;
  let a = parse($('d1').value), b = parse($('d2').value);
  let days = Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())) / 86400000);
  const sign = days < 0 ? -1 : 1;
  if (sign < 0) [a, b] = [b, a];
  let abs = Math.abs(days) + ($('incl').checked ? 1 : 0);
  $('days').textContent = (sign * abs).toLocaleString();
  $('weeks').textContent = `${Math.floor(abs/7)}週${abs%7}日`;
  let y = b.getFullYear()-a.getFullYear(), m = b.getMonth()-a.getMonth(), d = b.getDate()-a.getDate() + ($('incl').checked ? 1 : 0);
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  $('ymd').textContent = `${y}年${m}か月${d}日`;
}
function add() {
  if (!$('base').value) return;
  const d = parse($('base').value);
  d.setDate(d.getDate() + Number($('n').value || 0));
  $('after').textContent = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）`;
}
['d1','d2','incl'].forEach(i => $(i).addEventListener('input', diff));
['base','n'].forEach(i => $(i).addEventListener('input', add));
add();
</script>
</body>
</html>
